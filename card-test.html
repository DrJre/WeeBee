<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WeeBee Card Test — Common vs Rare vs SR</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #1a1a2e;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 40px;
        flex-wrap: wrap;
    }

    /* ── Card shell ─────────────────────────────────────────── */
    .wb-card {
        width: 280px;
        height: 392px; /* 5:7 trading card ratio */
        border-radius: 16px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0,0,0,0.45);
        font-family: inherit;
    }

    /* Common rarity frame — brushed silver/gray */
    .wb-card.rarity-common {
        background: linear-gradient(160deg, #c7ccd1 0%, #9aa1a8 50%, #7d848c 100%);
        padding: 8px;
    }
    /* Rare rarity frame — gold/prismatic */
    .wb-card.rarity-rare {
        background: linear-gradient(160deg, #fde68a 0%, #f59e0b 45%, #b45309 100%);
        padding: 8px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 30px rgba(245,158,11,0.4);
    }

    .wb-card-inner {
        width: 100%;
        height: 100%;
        border-radius: 11px;
        overflow: hidden;
        position: relative;
        background: #20242b;
        display: flex;
        flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .wb-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        z-index: 2;
    }
    /* Common: visible solid plate */
    /* Common: gradient-fade plate — solid near the card edge, fading gently to transparent toward the art */
    .rarity-common .wb-card-header {
        position: absolute;
        top: 0; left: 0; right: 0;
        background: linear-gradient(to bottom,
            rgba(20,22,28,0.97) 0%,
            rgba(20,22,28,0.86) 30%,
            rgba(20,22,28,0.62) 58%,
            rgba(20,22,28,0.32) 82%,
            transparent 100%);
        padding-bottom: 40px;
    }
    /* Rare: transparent, floats over full-bleed art */
    .rarity-rare .wb-card-header {
        position: absolute;
        top: 0; left: 0; right: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
    }

    .wb-mark {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
        color: rgba(255,255,255,0.85);
        text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .wb-rarity-gem {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.6);
        box-shadow: 0 2px 8px rgba(0,0,0,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
    }
    .rarity-common .wb-rarity-gem { background: linear-gradient(145deg, #e2e6ea, #9aa1a8); }
    .rarity-rare   .wb-rarity-gem { background: linear-gradient(145deg, #fde68a, #d97706); box-shadow: 0 2px 10px rgba(245,158,11,0.6); }

    /* ── Art ────────────────────────────────────────────────── */
    .wb-card-art {
        position: relative;
        overflow: hidden;
        flex: 1;
    }
    /* Rare & Common: art fills the whole card; header/footer float on top */
    .rarity-rare .wb-card-art,
    .rarity-common .wb-card-art {
        position: absolute;
        inset: 0;
    }
    .wb-card-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
    }
    /* Common: blurred, scaled-up backdrop spans the full card... */
    .rarity-common .wb-art-backdrop {
        position: absolute;
        inset: 0;
        object-fit: cover;
        filter: blur(18px) brightness(0.45) saturate(1.3);
        transform: scale(1.2);
        z-index: 0;
    }
    /* ...and the sharp focal art floats centered & fully visible above it */
    .rarity-common .wb-art-main {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        z-index: 1;
    }
    /* Rare needs a bottom gradient so footer text stays legible over art */
    .rarity-rare .wb-card-art::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(10,10,16,0.85) 0%, transparent 38%);
        z-index: 1;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    .wb-card-footer {
        padding: 12px 16px 14px;
        z-index: 2;
    }
    /* Common: gradient-fade plate — solid near the card edge, fading to transparent toward the art */
    .rarity-common .wb-card-footer {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: linear-gradient(to top,
            rgba(20,22,28,0.97) 0%,
            rgba(20,22,28,0.86) 30%,
            rgba(20,22,28,0.62) 58%,
            rgba(20,22,28,0.32) 82%,
            transparent 100%);
        padding-top: 40px;
    }
    /* Rare: transparent, floats over full-bleed art */
    .rarity-rare .wb-card-footer {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: transparent;
    }

    .wb-card-name {
        font-size: 18px;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        line-height: 1.15;
    }
    .wb-card-series {
        font-size: 12px;
        font-weight: 600;
        color: rgba(255,255,255,0.65);
        margin-top: 3px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .wb-card-rarity-label {
        display: inline-block;
        margin-top: 8px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 5px;
        border: 1px solid rgba(255,255,255,0.2);
    }
    .rarity-common .wb-card-rarity-label { background: rgba(255,255,255,0.10); color: #c7ccd1; }
    .rarity-rare   .wb-card-rarity-label { background: rgba(245,158,11,0.18); color: #fde68a; border-color: rgba(253,230,138,0.4); }

    /* ── SR rarity — cool holo/prismatic frame, full art + foil sheen, one notch fancier than Rare ── */
    .wb-card.rarity-sr {
        background: linear-gradient(155deg, #ddd6fe 0%, #a78bfa 30%, #6366f1 65%, #4338ca 100%);
        padding: 7px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 30px rgba(139,92,246,0.5);
    }
    .rarity-sr .wb-card-art { position: absolute; inset: 0; }
    .rarity-sr .wb-card-art::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(10,10,16,0.85) 0%, transparent 38%);
        z-index: 1;
    }
    /* Diagonal foil/holo sheen sweeping across the art */
    .rarity-sr .wb-card-art::before {
        content: '';
        position: absolute;
        inset: -20%;
        background: linear-gradient(115deg,
            transparent 30%,
            rgba(221,214,254,0.30) 42%,
            rgba(99,102,241,0.22) 50%,
            rgba(244,114,182,0.28) 58%,
            transparent 70%);
        mix-blend-mode: screen;
        z-index: 2;
        pointer-events: none;
    }
    .rarity-sr .wb-card-header {
        position: absolute;
        top: 0; left: 0; right: 0;
        background: linear-gradient(180deg, rgba(30,20,55,0.55) 0%, transparent 100%);
        z-index: 3;
    }
    .rarity-sr .wb-card-footer {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: transparent;
        z-index: 3;
    }
    .rarity-sr .wb-rarity-gem {
        background: linear-gradient(145deg, #ede9fe, #8b5cf6 55%, #4c1d95);
        box-shadow: 0 2px 12px rgba(139,92,246,0.7);
        border-radius: 4px;
        transform: rotate(45deg);
        width: 22px;
        height: 22px;
    }
    .rarity-sr .wb-rarity-gem span { display:inline-block; transform: rotate(-45deg); }
    .rarity-sr .wb-card-rarity-label { background: rgba(139,92,246,0.20); color: #ede9fe; border-color: rgba(221,214,254,0.4); }

    /* Caption under card */
    .wb-card-caption {
        text-align: center;
        margin-top: 16px;
        color: rgba(255,255,255,0.5);
        font-size: 13px;
    }
    .wb-card-wrap { display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>

    <div id="wb-card-grid" style="display:contents;"></div>

    <script>
        // ── Card data — append entries here to preview new art ──────────
        // rarity: 'common' | 'rare' | 'sr'
        const CARDS = [
            { name: 'Jean Kirstein', anime: 'Attack on Titan', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b46498-ritqAj9FW6jX.png', rarity: 'common', caption: 'Common — visible header & footer plates' },
            { name: 'Armin Arlert', anime: 'Attack on Titan', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b46494-g7xYYuBtYPnO.png', rarity: 'common', caption: 'Same plate structure — consistency check' },
            { name: 'Rangiku Matsumoto', anime: 'Bleach', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2FRangiku.jpg?alt=media&token=7950d22d-9255-42c5-ad3e-dccb31a322c2', rarity: 'sr', caption: 'SR — full-art + cool holo frame + diagonal foil sheen + faceted gem' },
            { name: 'Monkey D. Luffy', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_luffy.avif?alt=media&token=7d379fbf-5984-4a41-b62c-4068d06f43cd', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Nami', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_nami.avif?alt=media&token=a7d7912f-e758-4285-879a-5729dd64abe7', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Robin', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_robin.avif?alt=media&token=b987319c-c47e-4137-99c4-af9a3a826dd0', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Sanji', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_sanji.avif?alt=media&token=975cc211-46b3-4ea1-a0f0-630b27b51d03', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Usopp', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_usopp.avif?alt=media&token=133cfc8e-d160-4c8b-97fe-e0e4b94ad00f', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Zoro', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_zoro.avif?alt=media&token=232c431a-09f3-4467-b54e-37130e367f2c', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Jinbe', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_23wa_jinbe.avif?alt=media&token=6db14e64-94cf-4269-b93b-94eec88f3460', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Brook', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_brook.avif?alt=media&token=38ca74e2-3e4c-44db-8bbb-dc57b28cd5c3', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Chopper', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_chopper.avif?alt=media&token=05c00e1b-9a5c-4285-a9b0-1cd684f8ad1e', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Franky', anime: 'One Piece', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2Fopms_w_17fi_franky.avif?alt=media&token=511168ad-8067-4e9c-afde-dd06e3327b4c', rarity: 'sr', caption: 'SR — Wano arc art set' },
            { name: 'Ichigo', anime: 'Bleach', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2FIchigo.jpg?alt=media&token=4237e9e4-90e9-4949-b2ad-a4331cf287de', rarity: 'sr', caption: 'SR — Bleach art set' },
            { name: 'Orihime', anime: 'Bleach', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2FOrihime.jpg?alt=media&token=0134562c-1dc4-4db7-8166-221806097f02', rarity: 'sr', caption: 'SR — Bleach art set' },
            { name: 'Yoruichi', anime: 'Bleach', image: 'https://firebasestorage.googleapis.com/v0/b/weebee-fbbd8.firebasestorage.app/o/tcg-art%2FYoruichi.jpg?alt=media&token=1f6180a1-ef53-4d25-9324-12057675c07a', rarity: 'sr', caption: 'SR — Bleach art set' },
            { name: 'Mikasa Ackerman', anime: 'Attack on Titan', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b40881-F3gr1PkreDvj.png', rarity: 'rare', caption: 'Rare — full-art, same info floats over the art with no plate' },
            { name: 'Levi', anime: 'Attack on Titan', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b45627-CR68RyZmddGG.png', rarity: 'rare', caption: 'Same full-art treatment — consistency check' },
        ];

        const RARITY_LABELS = { common: 'Common', rare: 'Rare', sr: 'SR' };

        function renderCard(c) {
            const label = RARITY_LABELS[c.rarity] || c.rarity;
            const gem = c.rarity === 'sr'
                ? '<span class="wb-rarity-gem"><span>⬡</span></span>'
                : '<span class="wb-rarity-gem">⬡</span>';
            const art = c.rarity === 'common'
                ? `<img class="wb-art-backdrop" src="${c.image}" alt="" aria-hidden="true"><img class="wb-art-main" src="${c.image}" alt="${c.name}">`
                : `<img src="${c.image}" alt="${c.name}">`;

            return `
                <div class="wb-card-wrap">
                    <div class="wb-card rarity-${c.rarity}">
                        <div class="wb-card-inner">
                            <div class="wb-card-header">
                                <span class="wb-mark">WEEBEE</span>
                                ${gem}
                            </div>
                            <div class="wb-card-art">${art}</div>
                            <div class="wb-card-footer">
                                <div class="wb-card-name">${c.name}</div>
                                <div class="wb-card-series">${c.anime}</div>
                                <div class="wb-card-rarity-label">${label}</div>
                            </div>
                        </div>
                    </div>
                    <div class="wb-card-caption">${c.caption || ''}</div>
                </div>
            `;
        }

        document.getElementById('wb-card-grid').innerHTML = CARDS.map(renderCard).join('');
    </script>
</body>
</html>
